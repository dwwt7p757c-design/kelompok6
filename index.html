<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unggah PNG</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #172033; background: #f3f6fb; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 620px); padding: 32px; border: 1px solid #e1e7f0; border-radius: 20px; background: white; box-shadow: 0 16px 50px #19345a12; }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .intro, .note { color: #586579; }
    .dropzone { display: grid; min-height: 190px; place-content: center; justify-items: center; gap: 10px; margin-top: 24px; padding: 24px; text-align: center; border: 2px dashed #aab8cc; border-radius: 16px; background: #f9fbfe; transition: .2s ease; }
    .dropzone.active { border-color: #4768ed; background: #f0f3ff; }
    .icon { font-size: 2rem; }
    button, .button { display: inline-block; padding: 11px 18px; border: 0; border-radius: 10px; color: white; background: #405ee8; font: inherit; font-weight: 650; text-decoration: none; cursor: pointer; }
    button:hover, .button:hover { background: #304bc7; }
    input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .status { min-height: 24px; margin: 14px 0 0; color: #b42318; }
    .preview { display: none; margin-top: 20px; }
    .preview img { display: block; max-width: 100%; max-height: 420px; margin: 12px auto; border: 1px solid #e1e7f0; border-radius: 12px; object-fit: contain; background: conic-gradient(#e9edf3 25%, white 0 50%, #e9edf3 0 75%, white 0) 0 0 / 20px 20px; }
    .file-info { color: #586579; overflow-wrap: anywhere; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .secondary { color: #344054; background: #edf1f7; }
    .secondary:hover { background: #dfe5ee; }
    .note { margin: 22px 0 0; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Unggah PNG</h1>
    <p class="intro">Pilih atau seret file PNG untuk melihat pratinjau.</p>
    <section class="dropzone" id="dropzone" aria-label="Area unggah PNG">
      <div class="icon" aria-hidden="true">🖼️</div>
      <strong>Seret file PNG ke sini</strong>
      <span>atau</span>
      <label class="button" for="fileInput">Pilih file PNG</label>
      <input id="fileInput" type="file" accept=".png,image/png">
    </section>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <section class="preview" id="preview">
      <strong>Pratinjau</strong>
      <img id="imagePreview" alt="Pratinjau PNG yang dipilih">
      <p class="file-info" id="fileInfo"></p>
      <div class="actions">
        <a class="button" id="download" download>Unduh PNG</a>
        <button class="secondary" id="clear" type="button">Hapus pilihan</button>
      </div>
    </section>
    <p class="note">PNG saja, maksimal 10 MB. Gambar tidak disimpan ke server.</p>
  </main>
  <script>
    const input = document.getElementById("fileInput");
    const dropzone = document.getElementById("dropzone");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");
    const imagePreview = document.getElementById("imagePreview");
    const fileInfo = document.getElementById("fileInfo");
    const download = document.getElementById("download");
    let currentUrl = null;

    function clearPreview() {
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = null;
      preview.style.display = "none";
      imagePreview.removeAttribute("src");
      input.value = "";
    }

    async function handleFile(file) {
      status.textContent = "";
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) {
        clearPreview();
        status.textContent = "Ukuran file melebihi batas 10 MB.";
        return;
      }
      const bytes = new Uint8Array(await file.slice(0, 8).arrayBuffer());
      const signature = [137, 80, 78, 71, 13, 10, 26, 10];
      if (!signature.every((byte, i) => bytes[i] === byte)) {
        clearPreview();
        status.textContent = "File tidak valid. Silakan pilih gambar PNG.";
        return;
      }
      clearPreview();
      currentUrl = URL.createObjectURL(file);
      imagePreview.src = currentUrl;
      fileInfo.textContent = `${file.name} · ${(file.size / 1024 / 1024).toFixed(2)} MB`;
      download.href = currentUrl;
      download.download = file.name.toLowerCase().endsWith(".png") ? file.name : `${file.name}.png`;
      preview.style.display = "block";
    }

    input.addEventListener("change", () => handleFile(input.files[0]));
    document.getElementById("clear").addEventListener("click", clearPreview);
    dropzone.addEventListener("dragover", event => { event.preventDefault(); dropzone.classList.add("active"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("active"));
    dropzone.addEventListener("drop", event => {
      event.preventDefault();
      dropzone.classList.remove("active");
      handleFile(event.dataTransfer.files[0]);
    });
  </script>
</body>
</html>
